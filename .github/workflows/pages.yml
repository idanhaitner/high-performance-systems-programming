name: Deploy study site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: study/web/package-lock.json
      - name: Install
        working-directory: study/web
        run: npm ci
      - name: Unit tests
        working-directory: study/web
        run: npm test
      - name: Exporter tests
        working-directory: study/web
        run: python3 -m unittest discover -s scripts/course-export -p 'test_*.py'
      - name: Check exercises
        working-directory: study/web
        run: npm run check:exercises
      - name: Build
        working-directory: study/web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - name: Skip Jekyll so Next assets are served
        if: github.event_name != 'pull_request'
        run: touch study/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: study/web/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
