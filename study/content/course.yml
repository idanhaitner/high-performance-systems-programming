glossary:
  - term: bit
    topic: memory-and-pointers
    definition: A binary digit whose value is 0 or 1.
  - term: byte
    topic: memory-and-pointers
    definition: A sequence of 8 bits, drawn with the most significant bit on the left.
  - term: address
    topic: memory-and-pointers
    definition: The index of a byte in RAM, running from 0 up to 2^n - 1.
  - term: pointer
    topic: memory-and-pointers
    definition: A variable whose value is the address of an object.
  - term: dereference
    topic: memory-and-pointers
    definition: The object stored at the address a pointer holds, written with a leading star.
  - term: contiguous
    topic: memory-and-pointers
    definition: Stored one element after another, with no gap between neighbors.
  - term: preprocessor
    topic: source-to-process
    definition: The pipeline stage that handles #include, #define, and the other directives.
  - term: object file
    topic: source-to-process
    definition: The machine-code file the assembler writes, before the linker builds an executable.
  - term: linker
    topic: source-to-process
    definition: The stage that combines object files and libraries into an executable.
  - term: loader
    topic: source-to-process
    definition: The operating-system step that maps an executable's code and data into RAM and sets up a stack.
  - term: process
    topic: source-to-process
    definition: The running image of a program, entered in the process table under a PID.
  - term: ".text"
    topic: source-to-process
    definition: The section that holds the machine instructions of the program.
  - term: ".data"
    topic: source-to-process
    definition: The section for global and static variables initialized with nonzero values.
  - term: ".bss"
    topic: source-to-process
    definition: The section for global variables that are zero or have no explicit initializer.
  - term: ".rodata"
    topic: source-to-process
    definition: The read-only section for immutable initialized globals, string literals, and compiler constants.
  - term: stack
    topic: source-to-process
    definition: The high-address region that holds function calls and local variables and grows downward.
  - term: heap
    topic: source-to-process
    definition: The region for dynamic allocation, filled by malloc and released by free.
  - term: sizeof
    topic: c-data-types
    definition: The unary operator that returns how many bytes its operand occupies.
  - term: structure
    topic: structures
    definition: A contiguous object whose fields may have different types and appear in declaration order.
  - term: argc
    topic: command-line-arguments
    definition: The count of command-line words, including the program name and excluding the terminating null pointer.
  - term: argv
    topic: command-line-arguments
    definition: The null-terminated array of pointers to the command-line words.

exams: []
