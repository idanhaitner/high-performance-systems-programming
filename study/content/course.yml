id: high-performance-systems
title: High-Performance Systems Programming
lang: en
dir: ltr
summary: >
  Lecture 1 explains how C represents values, how objects occupy memory,
  how structures are laid out, how a program becomes a process, and how
  that process receives command-line arguments.

changelog:
  - date: 2026-10-22
    note: Opening guide on representation, memory, the process image, and the C that makes them visible.
  - date: 2026-10-22
    note: Rewrote Lecture 1 as six lessons, corrected representation and process claims, and grouped the lessons under one lecture.

lectures:
  - id: lecture-1
    number: 1
    title: Representation and processes
    summary: >
      Values, memory, structures, translation, and the arguments a process receives.
    topics: [why-low-level, c-data-types, memory-and-pointers, structures, source-to-process, command-line-arguments]

