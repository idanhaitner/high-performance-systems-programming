lectures:
  - id: lecture-1
    number: 1
    title: Data, memory, and running programs
    summary: >
      How a computer stores numbers, how memory and addresses work, how to print
      and read values and work with text, how to group data into records, how
      your C code becomes a running program, and how a program reads the words
      you type after its name.
    topics: [why-low-level, c-data-types, memory-and-pointers, printf-and-scanf, strings, structures, source-to-process, command-line-arguments]
    session: sessions/lecture-1.md
  - id: lecture-2
    number: 2
    title: Memory management
    summary: >
      How to follow a pointer that points to another pointer, move a pointer
      through an array, and keep the address of a function in a variable. Then
      the main topic: asking for memory while the program runs, growing it,
      giving it back, and choosing between a function's own short-lived memory
      and memory that stays until you free it.
    topics: [pointers-to-pointers, pointer-arithmetic, function-pointers, malloc-and-free, realloc-and-strings, stack-or-heap]
    session: sessions/lecture-2.md

