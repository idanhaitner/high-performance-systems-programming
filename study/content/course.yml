glossary:
  - term: bit
    topic: memory-and-pointers
    definition: A binary digit whose value is 0 or 1.
  - term: byte
    topic: memory-and-pointers
    definition: An addressable unit of 8 bits. In a value diagram, the most significant bit is drawn on the left.
  - term: address
    topic: memory-and-pointers
    definition: A value that identifies a byte in a process address space. Not every integer is a valid object pointer.
  - term: pointer
    topic: memory-and-pointers
    definition: An object that stores the address of another object, or a null pointer.
  - term: dereference
    topic: memory-and-pointers
    definition: The object designated by a pointer, written with a leading star. Dereferencing an invalid pointer is undefined behavior.
  - term: contiguous
    topic: memory-and-pointers
    definition: Stored with no gap between neighboring array elements. Structure members are ordered, but padding may separate them.
  - term: undefined behavior
    topic: c-data-types
    definition: Behavior on which the C standard imposes no requirements, including signed overflow and division by zero.
  - term: sizeof
    topic: c-data-types
    definition: The operator that yields the number of bytes in a type or object. Its result has type size_t.
  - term: structure
    topic: structures
    definition: An object with named members of possibly different types, laid out in declaration order, with possible padding.
  - term: preprocessor
    topic: source-to-process
    definition: The translation stage that processes include directives and macros before compilation.
  - term: object file
    topic: source-to-process
    definition: The relocatable machine-code file produced by the assembler, before the linker builds an executable.
  - term: linker
    topic: source-to-process
    definition: The stage that combines object files and libraries and resolves external definitions.
  - term: loader
    topic: source-to-process
    definition: The operating-system component that maps an executable into an address space and transfers control to its entry point.
  - term: process
    topic: source-to-process
    definition: A running instance of a program, with its own address space and process identifier.
  - term: ".text"
    topic: source-to-process
    definition: The conventional ELF section that holds machine instructions.
  - term: ".data"
    topic: source-to-process
    definition: The conventional ELF section for static objects whose initial bytes are not all zero.
  - term: ".bss"
    topic: source-to-process
    definition: The conventional ELF section that reserves zero-initialized static storage without storing those zeros in the file.
  - term: ".rodata"
    topic: source-to-process
    definition: A conventional read-only section for string literals and other immutable static data. const does not require this section.
  - term: stack
    topic: source-to-process
    definition: The conventional region for call frames and automatic objects, commonly drawn at high addresses and growing downward.
  - term: heap
    topic: source-to-process
    definition: The conventional region for objects created by malloc and released by free.
  - term: argc
    topic: command-line-arguments
    definition: The count of command-line arguments, including the program name and excluding the terminating null pointer.
  - term: argv
    topic: command-line-arguments
    definition: The null-terminated array of pointers to the modifiable command-line strings.

