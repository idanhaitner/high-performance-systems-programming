glossary:
  - term: bit
    topic: memory-and-pointers
    definition: The smallest piece of information a computer stores. A bit is either 0 or 1, like a light switch that is off or on.
  - term: byte
    topic: memory-and-pointers
    definition: A group of 8 bits. Memory is organized in bytes, and each byte has its own address. One byte can hold 256 different values (0 to 255).
  - term: address
    topic: memory-and-pointers
    definition: The number that identifies one byte of memory, like a house number on a very long street.
  - term: pointer
    topic: memory-and-pointers
    definition: A variable whose value is an address. It tells you where some other value lives in memory. A pointer can also be NULL, which means it points nowhere.
  - term: dereference
    topic: memory-and-pointers
    definition: Following a pointer to the value it points at, written with a star, as in *p. Following a pointer that does not point to a real value is a bug.
  - term: contiguous
    topic: memory-and-pointers
    definition: Side by side in memory with no gaps. The elements of an array are contiguous.
  - term: undefined behavior
    topic: c-data-types
    definition: A situation the C rules do not cover, such as dividing by zero or a signed int growing too large. The program may do anything, so you must avoid it.
  - term: sizeof
    topic: c-data-types
    definition: A C operator that tells you how many bytes a type or variable takes, for example sizeof(int) is 4 on typical machines.
  - term: format specifier
    topic: printf-and-scanf
    definition: A placeholder starting with % in a printf or scanf format string, such as %d for an int or %lf for reading a double. It says what type goes there and how to write it.
  - term: input buffer (stdin)
    topic: printf-and-scanf
    definition: The waiting area for the characters you type, including the Enter key. scanf takes only what it needs and leaves the rest for the next read.
  - term: getchar
    topic: printf-and-scanf
    definition: A function that takes one character from the input buffer and returns it. It returns EOF when the input has ended.
  - term: magic number
    topic: printf-and-scanf
    definition: A number written in the code with no name or explanation, such as 32 for the distance between small and capital letters. Give it a name instead.
  - term: const
    topic: c-data-types
    definition: A word that makes a variable read-only. const int limit = 30; cannot be changed by assignment later.
  - term: "#define"
    topic: c-data-types
    definition: A preprocessor line that makes a name stand for some text. #define MAX 30 replaces every MAX with 30 before compiling. It has no type and no semicolon.
  - term: string
    topic: strings
    definition: Text stored in a char array and ended by the character '\0'. The array needs one more cell than the number of letters.
  - term: strcmp
    topic: strings
    definition: A function that compares two strings letter by letter. It returns 0 if they are equal, a negative number if the first comes first, and a positive number otherwise.
  - term: strtok
    topic: strings
    definition: A function that splits a string into pieces at the delimiter characters you give it. Later calls pass NULL to continue in the same string. It changes the string.
  - term: warning
    topic: source-to-process
    definition: A compiler message about code that builds but looks wrong. Turn more of them on with -Wall -Wextra and fix each one.
  - term: header file
    topic: source-to-process
    definition: A .h file of declarations that several .c files share with #include, so each file knows how to call functions defined elsewhere.
  - term: include guard
    topic: source-to-process
    definition: The lines #ifndef NAME, #define NAME, and #endif around a header's contents, which make sure the header is pasted only once into each file.
  - term: structure
    topic: structures
    definition: A record that groups several named values, possibly of different types, into one variable. For example, a student with a name, an ID, and a grade.
  - term: preprocessor
    topic: source-to-process
    definition: The first step of building a C program. It pastes in #include files and replaces #define names with their text.
  - term: object file
    topic: source-to-process
    definition: A file of machine code made from one C file. It is not runnable yet, because it may still use functions defined elsewhere.
  - term: linker
    topic: source-to-process
    definition: The tool that joins object files and libraries into one runnable program, connecting each function call to the function's code.
  - term: loader
    topic: source-to-process
    definition: The part of the operating system that copies a program from disk into memory and starts it running.
  - term: process
    topic: source-to-process
    definition: A program that is currently running. Each process has its own memory and its own ID number.
  - term: ".text"
    topic: source-to-process
    definition: The part of a program file that holds the machine instructions, that is, your compiled code.
  - term: ".data"
    topic: source-to-process
    definition: The part of a program file that holds global variables that start with a non-zero value, such as int count = 5; at file level.
  - term: ".bss"
    topic: source-to-process
    definition: The part of a program's memory for global variables that start at zero. The file only records how much space is needed, not the zeros themselves.
  - term: ".rodata"
    topic: source-to-process
    definition: The read-only part of a program file, typically holding fixed text such as the string in printf("hello").
  - term: stack
    topic: source-to-process
    definition: The memory area for local variables of functions. Each function call gets its own space there, which is freed when the function returns.
  - term: heap
    topic: source-to-process
    definition: The memory area for values you request at run time with malloc and give back with free.
  - term: argc
    topic: command-line-arguments
    definition: The number of words on the command line, counting the program name itself. For ./sum 3 4, argc is 3.
  - term: argv
    topic: command-line-arguments
    definition: The list of words on the command line, as text. argv[0] is the program name, argv[1] is the first word after it, and so on.
  - term: pointer to pointer
    topic: pointers-to-pointers
    definition: A variable that holds the address of another pointer, with a type like int **. One star reaches the middle pointer, two stars reach the final value.
  - term: pointer arithmetic
    topic: pointer-arithmetic
    definition: Adding a number to a pointer, or subtracting two pointers. It counts whole elements, not bytes, so for an int pointer p + 1 is 4 bytes further on.
  - term: NULL
    topic: pointer-arithmetic
    definition: A special pointer value that means "points nowhere". Following a NULL pointer crashes the program, so check for it first.
  - term: segmentation fault
    topic: pointer-arithmetic
    definition: A crash the operating system causes when a program touches memory it may not use, such as address 0 (NULL).
  - term: function pointer
    topic: function-pointers
    definition: A variable that holds the address of a function. Calling through it runs that function, so a program can choose which function to run while it is running.
  - term: typedef
    topic: function-pointers
    definition: A way to give an existing type a new, shorter name, such as typedef void (*func)(int *); for a function pointer type.
  - term: dynamic memory allocation
    topic: malloc-and-free
    definition: Asking for memory while the program runs, with malloc, calloc, or realloc, instead of fixing the size when you write the code. The memory comes from the heap.
  - term: malloc
    topic: malloc-and-free
    definition: A function that reserves a block of the given number of bytes on the heap and returns its address, or NULL if there is no memory left. The bytes start as garbage.
  - term: free
    topic: malloc-and-free
    definition: A function that gives a heap block back. It needs the exact address malloc returned, and each block may be freed only once.
  - term: calloc
    topic: malloc-and-free
    definition: Like malloc, but takes a count and the size of one element, and sets every byte of the new block to zero.
  - term: "void *"
    topic: malloc-and-free
    definition: A pointer to a value of unknown type. malloc returns one, and C converts it to the pointer type you store it in.
  - term: memory leak
    topic: malloc-and-free
    definition: Heap memory that was reserved and never freed. It stays taken until the program ends.
  - term: dangling pointer
    topic: malloc-and-free
    definition: A pointer that holds the address of memory that is no longer yours, such as a freed block or a local variable of a function that has returned.
  - term: double free
    topic: malloc-and-free
    definition: Calling free twice on the same block. It is a bug that usually stops the program. Setting the pointer to NULL after free prevents it.
  - term: realloc
    topic: realloc-and-strings
    definition: A function that changes the size of a heap block, keeping its contents. It may move the block, so you must use the address it returns.
  - term: strlen
    topic: realloc-and-strings
    definition: A function that counts the characters in a string, not counting the '\0' at the end. strlen("Mili") is 4.
  - term: strcpy
    topic: realloc-and-strings
    definition: A function that copies one string, including its '\0', into another place in memory. The destination must be big enough.
  - term: fgets
    topic: realloc-and-strings
    definition: A function that reads one line of text into an array, never more than the size you give it. It keeps the newline if it fits.
  - term: stack overflow
    topic: stack-or-heap
    definition: A crash that happens when a program needs more stack memory than its limit, for example for a huge local array.
exams: []
