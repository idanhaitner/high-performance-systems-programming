id: high-performance-systems
title: High-Performance Systems Programming
lang: en
dir: ltr
summary: >
  Why some programs run fast and others run slow, explained from the ground up.
  The course has three parts. First you learn C, a small language that shows
  you how memory works, along with the Linux command line. Then you learn to
  measure how long a program takes, and how the processor's cache, a small and
  very fast memory, rewards code that reads nearby values in order. Last you
  split a job across the several cores of one processor with OpenMP, and across
  the thousands of tiny workers on a graphics card with CUDA. No prior C or
  systems knowledge is assumed. Each lesson has short explanations and practice
  questions.

changelog:
  - date: 2026-10-22
    note: Opening guide on representation, memory, the process image, and the C that makes them visible.
  - date: 2026-10-22
    note: Rewrote Lecture 1 as six lessons, corrected representation and process claims, and grouped the lessons under one lecture.
  - date: 2026-10-24
    note: Edited Lecture 1 for clarity and corrected the struct initializer, pointer addition, process startup, and printf output answers.
  - date: 2026-10-24
    note: Rewrote the overview, every Lecture 1 lesson, and the glossary for readers starting from zero, explaining each term before using it.
  - date: 2026-10-28
    note: Added the Lecture 1 guided session, with short readings, quick questions, six coding exercises you solve in the page, and a timing lab for VS Code.
  - date: 2026-10-29
    note: Renamed the guided session to the lecture practice and made the order clear everywhere. First read a lecture's lessons, then do its practice.
  - date: 2026-10-29
    note: Added Lecture 2, memory management, as six lessons on pointers to pointers, pointer arithmetic, function pointers, malloc and free, realloc and arrays of strings, and choosing the stack or the heap, plus its practice with six coding exercises and a stack-limit lab.
  - date: 2026-10-29
    note: Brought the first practice session (Tutorial 1) into Lecture 1. Two new lessons cover printing and reading values and working with strings, other lessons gained compiling with warnings, programs in several files, constants, if and loops, and pointer tips, and the practice has two more exercises.
  - date: 2026-10-30
    note: Shortened the practice of both lectures. Copied recaps are gone, each lesson now has one new question and its coding exercise, every step links to its lesson, and the Lecture 1 lab comes last.
  - date: 2026-10-30
    note: Added a very small code question to every lesson's practice, 14 in all, and a final exercise at the end of both labs that uses everything from the lecture.
  - date: 2026-10-30
    note: Made the practice harder and cleaner. Exercises and labs now start from the bare function with no comments, the questions ask you to reason through traps instead of recalling a fact, and the code editor can format your code.
  - date: 2026-11-01
    note: Brought the second practice session (Tutorial 2) into Lecture 2. Four new lessons cover casting, how function calls use the stack, structures on the stack and on the heap, and finding memory bugs with GDB and Valgrind. Two other lessons gained use-after-free and a side-by-side comparison of the stack and the heap, and the practice has six more exercises.
  - date: 2026-11-05
    note: Added Lecture 3, memory layout, alignment, and the cache, as six lessons on how C lays out arrays and tables, alignment and padding, cache lines and hits, how an address picks its place in the cache, locality and prefetching, and loop order, layout, and blocking, plus its practice with nine coding exercises and a matrix-multiplication lab.

lectures:
  - id: lecture-1
    number: 1
    title: Data, memory, and running programs
    summary: >
      How a computer stores numbers, how memory and addresses work, how to print
      and read values and work with text, how to group data into records, how
      your C code becomes a running program, and how a program reads the words
      you type after its name.
    topics: [why-low-level, c-data-types, memory-and-pointers, printf-and-scanf, strings, structures, source-to-process, command-line-arguments]
    session: sessions/lecture-1.md
  - id: lecture-2
    number: 2
    title: Memory management
    summary: >
      How a value changes when it moves to another type, how to follow a pointer
      that points to another pointer, move a pointer through an array, and keep
      the address of a function in a variable. Then the main topic: what a
      function call does to memory, asking for memory while the program runs,
      growing it, giving it back, and choosing between a function's own
      short-lived memory and memory that stays until you free it. It ends with
      records in memory and the tools that find memory bugs.
    topics: [casting, pointers-to-pointers, pointer-arithmetic, function-pointers, stack-frames, malloc-and-free, realloc-and-strings, stack-or-heap, structures-on-the-heap, debugging-tools]
    session: sessions/lecture-2.md
  - id: lecture-3
    number: 3
    title: Memory layout, alignment, and the cache
    summary: >
      Where C puts arrays, structures, and tables in memory, why the compiler
      adds empty bytes between members, and how the processor's cache moves
      memory in lines and decides where each line goes. Then why the order you
      read memory in changes the speed: counting cache lines, loop order,
      arrays of structures against structures of arrays, and blocking a matrix
      multiplication into tiles.
    topics: [memory-layout, alignment-and-padding, cache-lines, cache-mapping, locality-and-prefetching, efficient-c]
    session: sessions/lecture-3.md

