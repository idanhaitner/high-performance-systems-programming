<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>


  <rect width="720" height="300" fill="#f7f6ff"/>
  <g class="step" style="animation-delay:0.08s">
    <rect x="24" y="40" width="196" height="150" rx="14" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="42" y="72" class="t" font-size="18" font-weight="700">x</text>
    <text x="42" y="106" class="m" font-size="13">address</text>
    <text x="124" y="106" class="mono" font-size="16">1020</text>
    <text x="42" y="140" class="m" font-size="13">value</text>
    <text x="124" y="140" class="mono" font-size="16">10</text>
    <text x="36" y="172" class="mono" font-size="11">int x = 10;</text>
  </g>
  <g class="step" style="animation-delay:0.20s">
    <rect x="262" y="40" width="196" height="150" rx="14" fill="#ffffff" stroke="#1b1740" stroke-width="2"/>
    <text x="280" y="72" class="t" font-size="18" font-weight="700">ptr</text>
    <text x="280" y="106" class="m" font-size="13">address</text>
    <text x="362" y="106" class="mono" font-size="16">1024</text>
    <text x="280" y="140" class="m" font-size="13">value</text>
    <text x="362" y="140" class="mono" font-size="16">1020</text>
    <text x="274" y="172" class="mono" font-size="11">int *ptr = &amp;x;</text>
  </g>
  <g class="step" style="animation-delay:0.32s">
    <rect x="500" y="40" width="196" height="150" rx="14" fill="#ffffff" stroke="#1b1740" stroke-width="2"/>
    <text x="518" y="72" class="t" font-size="18" font-weight="700">ptr_to_ptr</text>
    <text x="518" y="106" class="m" font-size="13">address</text>
    <text x="600" y="106" class="mono" font-size="16">1032</text>
    <text x="518" y="140" class="m" font-size="13">value</text>
    <text x="600" y="140" class="mono" font-size="16">1024</text>
    <text x="512" y="172" class="mono" font-size="11">int **ptr_to_ptr = &amp;ptr;</text>
  </g>
  <g class="step" style="animation-delay:0.44s">
    <path d="M262 140 H228" stroke="#4b3cf5" stroke-width="2" fill="none"/>
    <path d="M230 134 L220 140 L230 146" fill="#4b3cf5"/>
  </g>
  <g class="step" style="animation-delay:0.56s">
    <path d="M500 140 H466" stroke="#4b3cf5" stroke-width="2" fill="none"/>
    <path d="M468 134 L458 140 L468 146" fill="#4b3cf5"/>
  </g>
  <g class="step" style="animation-delay:0.68s">
    <text x="24" y="240" class="t" font-size="15">*ptr_to_ptr follows one arrow and reaches ptr, which holds 1020.</text>
    <text x="24" y="266" class="m" font-size="14">**ptr_to_ptr follows both arrows and reaches x, which holds 10.</text>
  </g>

</svg>
