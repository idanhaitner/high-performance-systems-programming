<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .g { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #17784f; }
  .r { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #b4233f; }
  .a { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4b3cf5; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="250" fill="#f7f6ff"/>
  <g class="step" style="animation-delay:0.08s">
  <text x="24" y="34" class="t" font-size="15" text-anchor="start" font-weight="700">Byte addresses 0 to 11</text>
  <rect x="24" y="54" width="56" height="56" fill="#ffffff" stroke="#6b6690" stroke-width="1.5"/>
  <text x="52.0" y="86.9" class="mono" font-size="14" text-anchor="middle">0</text>
  <rect x="80" y="54" width="56" height="56" fill="#ffffff" stroke="#6b6690" stroke-width="1.5"/>
  <text x="108.0" y="86.9" class="mono" font-size="14" text-anchor="middle">1</text>
  <rect x="136" y="54" width="56" height="56" fill="#ffffff" stroke="#6b6690" stroke-width="1.5"/>
  <text x="164.0" y="86.9" class="mono" font-size="14" text-anchor="middle">2</text>
  <rect x="192" y="54" width="56" height="56" fill="#ffffff" stroke="#6b6690" stroke-width="1.5"/>
  <text x="220.0" y="86.9" class="mono" font-size="14" text-anchor="middle">3</text>
  <rect x="248" y="54" width="56" height="56" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="276.0" y="86.9" class="mono" font-size="14" text-anchor="middle">4</text>
  <rect x="304" y="54" width="56" height="56" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="332.0" y="86.9" class="mono" font-size="14" text-anchor="middle">5</text>
  <rect x="360" y="54" width="56" height="56" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="388.0" y="86.9" class="mono" font-size="14" text-anchor="middle">6</text>
  <rect x="416" y="54" width="56" height="56" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="444.0" y="86.9" class="mono" font-size="14" text-anchor="middle">7</text>
  <rect x="472" y="54" width="56" height="56" fill="#ffffff" stroke="#6b6690" stroke-width="1.5"/>
  <text x="500.0" y="86.9" class="mono" font-size="14" text-anchor="middle">8</text>
  <rect x="528" y="54" width="56" height="56" fill="#ffffff" stroke="#6b6690" stroke-width="1.5"/>
  <text x="556.0" y="86.9" class="mono" font-size="14" text-anchor="middle">9</text>
  <rect x="584" y="54" width="56" height="56" fill="#ffffff" stroke="#6b6690" stroke-width="1.5"/>
  <text x="612.0" y="86.9" class="mono" font-size="14" text-anchor="middle">10</text>
  <rect x="640" y="54" width="56" height="56" fill="#ffffff" stroke="#6b6690" stroke-width="1.5"/>
  <text x="668.0" y="86.9" class="mono" font-size="14" text-anchor="middle">11</text>
  <text x="360" y="138" class="a" font-size="15" text-anchor="middle" font-weight="700">4-byte int at address 4</text>
  </g>
  <g class="step" style="animation-delay:0.24s">
  <rect x="24" y="160" width="672" height="64" rx="12" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="48" y="200" class="g" font-size="20" text-anchor="start" font-weight="700">4 mod 4 = 0</text>
  <text x="250" y="198" class="t" font-size="15" text-anchor="start">The int starts on a natural 4-byte boundary.</text>
  </g>
</svg>
