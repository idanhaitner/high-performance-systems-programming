<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img">

<style>
  .t { font-family: Heebo, system-ui, sans-serif; fill: #1c2740; }
  .m { font-family: Heebo, system-ui, sans-serif; fill: #5c6b82; }
  .w { font-family: Heebo, system-ui, sans-serif; fill: #ffffff; }
  .mono { font-family: "Source Code Pro", ui-monospace, monospace; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>


  <rect width="720" height="460" fill="#f4f7fb"/>
  <text x="250" y="28" class="m" font-size="13">High addresses</text>
  <g class="step" style="animation-delay:0.08s">
    <rect x="180" y="40" width="280" height="70" fill="#1c2740"/>
    <text x="320" y="72" text-anchor="middle" class="w" font-size="16" font-weight="700">Stack</text>
    <text x="320" y="94" text-anchor="middle" class="w" font-size="12">grows downward · locals, calls</text>
  </g>
  <g class="step" style="animation-delay:0.20s">
    <rect x="180" y="110" width="280" height="70" fill="#e7eef8" stroke="#c5d0e0"/>
    <text x="320" y="150" text-anchor="middle" class="m" font-size="14">Free space</text>
  </g>
  <g class="step" style="animation-delay:0.32s">
    <rect x="180" y="180" width="280" height="70" fill="#2f6fed"/>
    <text x="320" y="212" text-anchor="middle" class="w" font-size="16" font-weight="700">Heap</text>
    <text x="320" y="234" text-anchor="middle" class="w" font-size="12">grows upward · dynamic allocation</text>
  </g>
  <g class="step" style="animation-delay:0.44s">
    <rect x="180" y="250" width="280" height="70" fill="#d9e6ff" stroke="#2f6fed"/>
    <text x="320" y="282" text-anchor="middle" class="t" font-size="16" font-weight="700">Global / static data</text>
    <text x="320" y="304" text-anchor="middle" class="m" font-size="12">.data · .bss · .rodata</text>
  </g>
  <g class="step" style="animation-delay:0.56s">
    <rect x="180" y="320" width="280" height="70" fill="#ffffff" stroke="#1c2740"/>
    <text x="320" y="352" text-anchor="middle" class="t" font-size="16" font-weight="700">Code (.text)</text>
    <text x="320" y="374" text-anchor="middle" class="m" font-size="12">program instructions</text>
  </g>
  <text x="250" y="420" class="m" font-size="13">Low addresses</text>
  <text x="24" y="448" class="m" font-size="12">Programmer's conceptual view. The exact layout can vary.</text>

</svg>
