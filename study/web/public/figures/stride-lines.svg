  <text x="24" y="30" class="mono" font-size="14" text-anchor="start" font-weight="700">for (i = 0; i &lt; N; i += stride) sum += a[i];</text>
  <text x="24" y="52" class="m" font-size="13" text-anchor="start">Each row is one 64-byte cache line: 16 ints. Green squares are the ints the loop uses.</text>
