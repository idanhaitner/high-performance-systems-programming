<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img">

<style>
  .t { font-family: Heebo, system-ui, sans-serif; fill: #2c2140; }
  .m { font-family: Heebo, system-ui, sans-serif; fill: #6d6080; }
  .w { font-family: Heebo, system-ui, sans-serif; fill: #ffffff; }
  .mono { font-family: "Source Code Pro", ui-monospace, monospace; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>


  <rect width="720" height="390" fill="#f7f4fb"/>
  <text x="24" y="32" class="t" font-size="15" font-weight="700">Row-major layout of A[i][j]</text>
  <text x="24" y="52" class="m" font-size="13">Each row is 2049 ints. Neighbors in a row sit next to each other.</text>
  <g class="step" style="animation-delay:0.08s">
    <text x="24" y="88" class="m" font-size="12">row i</text>
    <rect x="80" y="68" width="48" height="36" rx="6" fill="#eadcff" stroke="#6d4ad4"/><text x="104" y="91" text-anchor="middle" class="mono" font-size="12">j=0</text><rect x="132" y="68" width="48" height="36" rx="6" fill="#eadcff" stroke="#6d4ad4"/><text x="156" y="91" text-anchor="middle" class="mono" font-size="12">j=1</text><rect x="184" y="68" width="48" height="36" rx="6" fill="#eadcff" stroke="#6d4ad4"/><text x="208" y="91" text-anchor="middle" class="mono" font-size="12">j=2</text><rect x="236" y="68" width="48" height="36" rx="6" fill="#eadcff" stroke="#6d4ad4"/><text x="260" y="91" text-anchor="middle" class="mono" font-size="12">j=3</text>
    <text x="300" y="91" class="m" font-size="16">…</text>
    <rect x="332" y="68" width="70" height="36" rx="6" fill="#eadcff" stroke="#6d4ad4"/>
    <text x="367" y="91" text-anchor="middle" class="mono" font-size="12">j=2048</text>
  </g>
  <g class="step" style="animation-delay:0.20s">
    <path d="M104 116 C140 140, 180 140, 208 116" fill="none" stroke="#1f7a4d" stroke-width="2"/>
    <path d="M200 122 L212 114 L198 108" fill="#1f7a4d"/>
    <text x="24" y="156" class="t" font-size="14">i outer, j inner: the next element is the next address.</text>
  </g>
  <g class="step" style="animation-delay:0.32s">
    <text x="24" y="196" class="m" font-size="12">column j</text>
    <rect x="110" y="176" width="72" height="32" rx="6" fill="#f8e4e1" stroke="#9a3b2f"/>
    <text x="146" y="197" text-anchor="middle" class="mono" font-size="12">i = 0</text>
    <rect x="110" y="220" width="72" height="32" rx="6" fill="#f8e4e1" stroke="#9a3b2f"/>
    <text x="146" y="241" text-anchor="middle" class="mono" font-size="12">i = 1</text>
    <rect x="110" y="264" width="72" height="32" rx="6" fill="#f8e4e1" stroke="#9a3b2f"/>
    <text x="146" y="285" text-anchor="middle" class="mono" font-size="12">i = 2</text>
    <path d="M182 192 H250" stroke="#9a3b2f" stroke-width="2"/>
    <path d="M242 186 L254 192 L242 198" fill="#9a3b2f"/>
    <text x="264" y="188" class="t" font-size="14">j outer, i inner</text>
    <text x="264" y="210" class="m" font-size="13">Each step jumps a whole row:</text>
    <text x="264" y="232" class="mono" font-size="13">2049 × sizeof(int) bytes</text>
  </g>
  <g class="step" style="animation-delay:0.44s">
    <rect x="24" y="320" width="672" height="48" rx="10" fill="#efe6f8"/>
    <text x="40" y="349" class="t" font-size="14">Step of 3 copies three neighbors. 2049 = 3 × 683, so each row is covered exactly.</text>
  </g>

</svg>
