<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">

<style>
  .t { font-family: Heebo, system-ui, sans-serif; fill: #1c2740; }
  .m { font-family: Heebo, system-ui, sans-serif; fill: #5c6b82; }
  .w { font-family: Heebo, system-ui, sans-serif; fill: #ffffff; }
  .mono { font-family: "Source Code Pro", ui-monospace, monospace; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>


  <rect width="720" height="340" fill="#f4f7fb"/>
  <g class="step" style="animation-delay:0.08s">
    <text x="36" y="40" class="mono" font-size="15">int x;</text>
    <text x="280" y="40" class="t" font-size="15">.bss — global, no explicit initializer</text>
  </g>
  <g class="step" style="animation-delay:0.20s">
    <text x="36" y="84" class="mono" font-size="15">int y = 10;</text>
    <text x="280" y="84" class="t" font-size="15">.data — global initialized nonzero</text>
  </g>
  <g class="step" style="animation-delay:0.32s">
    <text x="36" y="128" class="mono" font-size="15">const int z = 5;</text>
    <text x="280" y="128" class="t" font-size="15">.rodata — often used for const data</text>
  </g>
  <g class="step" style="animation-delay:0.44s">
    <text x="36" y="172" class="mono" font-size="15">"z = %d"</text>
    <text x="280" y="172" class="t" font-size="15">.rodata — string literal</text>
  </g>
  <g class="step" style="animation-delay:0.56s">
    <text x="36" y="216" class="mono" font-size="15">int a = 12;</text>
    <text x="280" y="216" class="t" font-size="15">stack — local variable inside main</text>
  </g>
  <g class="step" style="animation-delay:0.68s">
    <text x="36" y="260" class="mono" font-size="15">instructions</text>
    <text x="280" y="260" class="t" font-size="15">.text — the code of main</text>
  </g>
  <g class="step" style="animation-delay:0.80s">
    <text x="36" y="312" class="m" font-size="14">Heap is the region for dynamic allocation. malloc and free fill it.</text>
  </g>

</svg>
