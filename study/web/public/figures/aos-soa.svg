<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .g { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #17784f; }
  .r { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #b4233f; }
  .a { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4b3cf5; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="330" fill="#f7f6ff"/>
  <g class="step" style="animation-delay:0.08s">
  <text x="24" y="34" class="t" font-size="16" text-anchor="start" font-weight="700">Array of structures</text>
  <rect x="24" y="50" width="38" height="46" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="43.0" y="77.2" class="mono" font-size="12" text-anchor="middle">x0</text>
  <rect x="62" y="50" width="38" height="46" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
  <text x="81.0" y="77.2" class="mono" font-size="12" text-anchor="middle">y0</text>
  <rect x="100" y="50" width="38" height="46" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
  <text x="119.0" y="77.2" class="mono" font-size="12" text-anchor="middle">z0</text>
  <rect x="138" y="50" width="38" height="46" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="157.0" y="77.2" class="mono" font-size="12" text-anchor="middle">x1</text>
  <rect x="176" y="50" width="38" height="46" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
  <text x="195.0" y="77.2" class="mono" font-size="12" text-anchor="middle">y1</text>
  <rect x="214" y="50" width="38" height="46" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
  <text x="233.0" y="77.2" class="mono" font-size="12" text-anchor="middle">z1</text>
  <rect x="252" y="50" width="38" height="46" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="271.0" y="77.2" class="mono" font-size="12" text-anchor="middle">x2</text>
  <rect x="290" y="50" width="38" height="46" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
  <text x="309.0" y="77.2" class="mono" font-size="12" text-anchor="middle">y2</text>
  <rect x="328" y="50" width="38" height="46" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
  <text x="347.0" y="77.2" class="mono" font-size="12" text-anchor="middle">z2</text>
  <text x="24" y="124" class="m" font-size="13" text-anchor="start">Good when each step needs x, y, and z together</text>
  <rect x="24" y="150" width="310" height="44" rx="10" fill="#1b1740" stroke="#1b1740" stroke-width="0"/>
  <text x="44" y="178" class="w" font-size="15" text-anchor="start">sum += points[i].x;</text>
  <text x="24" y="222" class="r" font-size="14" text-anchor="start" font-weight="700">Only a third of each line is x.</text>
  </g>
  <g class="step" style="animation-delay:0.24s">
  <text x="384" y="34" class="t" font-size="16" text-anchor="start" font-weight="700">Structure of arrays</text>
  <rect x="384" y="50" width="36" height="46" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="402.0" y="77.2" class="mono" font-size="12" text-anchor="middle">x0</text>
  <rect x="420" y="50" width="36" height="46" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="438.0" y="77.2" class="mono" font-size="12" text-anchor="middle">x1</text>
  <rect x="456" y="50" width="36" height="46" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="474.0" y="77.2" class="mono" font-size="12" text-anchor="middle">x2</text>
  <rect x="492" y="50" width="36" height="46" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="510.0" y="77.2" class="mono" font-size="12" text-anchor="middle">x3</text>
  <rect x="528" y="50" width="36" height="46" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="546.0" y="77.2" class="mono" font-size="12" text-anchor="middle">x4</text>
  <rect x="564" y="50" width="36" height="46" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="582.0" y="77.2" class="mono" font-size="12" text-anchor="middle">x5</text>
  <rect x="600" y="50" width="36" height="46" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="618.0" y="77.2" class="mono" font-size="12" text-anchor="middle">x6</text>
  <rect x="636" y="50" width="36" height="46" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="654.0" y="77.2" class="mono" font-size="12" text-anchor="middle">x7</text>
  <text x="384" y="124" class="m" font-size="13" text-anchor="start">Good when a step scans only x</text>
  <rect x="384" y="150" width="310" height="44" rx="10" fill="#1b1740" stroke="#1b1740" stroke-width="0"/>
  <text x="404" y="178" class="w" font-size="15" text-anchor="start">sum += x[i];</text>
  <text x="384" y="222" class="g" font-size="14" text-anchor="start" font-weight="700">Every byte of each line is x.</text>
  </g>
  <g class="step" style="animation-delay:0.40s">
  <text x="360" y="288" class="g" font-size="17" text-anchor="middle" font-weight="700">Choose the layout that matches the dominant access pattern.</text>
  </g>
</svg>
