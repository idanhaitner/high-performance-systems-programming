<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">

<style>
  .t { font-family: Heebo, system-ui, sans-serif; fill: #1c2740; }
  .m { font-family: Heebo, system-ui, sans-serif; fill: #5c6b82; }
  .w { font-family: Heebo, system-ui, sans-serif; fill: #ffffff; }
  .mono { font-family: "Source Code Pro", ui-monospace, monospace; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>


  <rect width="720" height="420" fill="#f4f7fb"/>
  <text x="24" y="30" class="m" font-size="13">./a.out Omer 2 3</text>
  <g class="step" style="animation-delay:0.08s">
    <text x="36" y="64" class="t" font-size="14" font-weight="700">Stack</text>
    <rect x="36" y="76" width="280" height="250" rx="12" fill="#ffffff" stroke="#1c2740"/>
    <text x="52" y="108" class="mono" font-size="14">argc</text>
    <text x="230" y="108" class="mono" font-size="14">4</text>
    <text x="52" y="140" class="mono" font-size="14">argv</text>
    <text x="200" y="140" class="mono" font-size="14">1000</text>
    <line x1="52" y1="156" x2="300" y2="156" stroke="#e1e8f2"/>
    <text x="52" y="184" class="mono" font-size="13">argv[0]</text><text x="220" y="184" class="mono" font-size="13">100</text>
    <text x="52" y="210" class="mono" font-size="13">argv[1]</text><text x="220" y="210" class="mono" font-size="13">108</text>
    <text x="52" y="236" class="mono" font-size="13">argv[2]</text><text x="220" y="236" class="mono" font-size="13">113</text>
    <text x="52" y="262" class="mono" font-size="13">argv[3]</text><text x="220" y="262" class="mono" font-size="13">115</text>
    <text x="52" y="292" class="mono" font-size="13">argv[4]</text><text x="210" y="292" class="mono" font-size="13">NULL</text>
  </g>
  <g class="step" style="animation-delay:0.20s">
    <text x="380" y="64" class="t" font-size="14" font-weight="700">Character arrays</text>
    <text x="380" y="86" class="m" font-size="12">Read-only data</text>
    <rect x="380" y="104" width="300" height="44" rx="8" fill="#d9e6ff" stroke="#2f6fed"/>
    <text x="396" y="132" class="mono" font-size="14">100   "./a.out"</text>
    <rect x="380" y="156" width="300" height="44" rx="8" fill="#d9e6ff" stroke="#2f6fed"/>
    <text x="396" y="184" class="mono" font-size="14">108   "Omer"</text>
    <rect x="380" y="208" width="300" height="44" rx="8" fill="#d9e6ff" stroke="#2f6fed"/>
    <text x="396" y="236" class="mono" font-size="14">113   "2"</text>
    <rect x="380" y="260" width="300" height="44" rx="8" fill="#d9e6ff" stroke="#2f6fed"/>
    <text x="396" y="288" class="mono" font-size="14">115   "3"</text>
  </g>
  <text x="36" y="360" class="t" font-size="14">The gaps are the string lengths, including the terminating NUL.</text>
  <text x="36" y="384" class="m" font-size="13">"./a.out" is 8 bytes, "Omer" is 5, "2" is 2. argc counts words and does not count the NULL.</text>
  <text x="36" y="408" class="m" font-size="13">100, 108, 113, 115, and 1000 are example addresses.</text>

</svg>
