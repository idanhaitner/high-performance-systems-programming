<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>
<rect width="720" height="420" fill="#f7f6ff"/>
<text x="24" y="32" class="m" font-size="13">The value 42. Leading bits on the left are zeros. The addresses label these objects.</text>

<g class="step" style="animation-delay:0.08s">
  <text x="24" y="68" class="t" font-size="14" font-weight="700">char a</text>
  <text x="110" y="68" class="m" font-size="13">1 byte · address 1000</text>
  <rect x="520" y="46" width="176" height="32" rx="6" fill="#4b3cf5"/>
  <text x="608" y="67" text-anchor="middle" class="w mono" font-size="13">00101010</text>
</g>

<g class="step" style="animation-delay:0.20s">
  <text x="24" y="124" class="t" font-size="14" font-weight="700">short b</text>
  <text x="110" y="124" class="m" font-size="13">2 bytes · address 1002</text>
  <rect x="336" y="102" width="176" height="32" rx="6" fill="#e6e2ff" stroke="#4b3cf5"/>
  <text x="424" y="123" text-anchor="middle" class="mono" font-size="13">00000000</text>
  <rect x="520" y="102" width="176" height="32" rx="6" fill="#4b3cf5"/>
  <text x="608" y="123" text-anchor="middle" class="w mono" font-size="13">00101010</text>
</g>

<g class="step" style="animation-delay:0.32s">
  <text x="24" y="180" class="t" font-size="14" font-weight="700">int c</text>
  <text x="110" y="180" class="m" font-size="13">4 bytes · address 1024</text>
  <rect x="24" y="196" width="160" height="32" rx="6" fill="#e6e2ff" stroke="#4b3cf5"/>
  <text x="104" y="217" text-anchor="middle" class="mono" font-size="13">00000000</text>
  <rect x="192" y="196" width="160" height="32" rx="6" fill="#e6e2ff" stroke="#4b3cf5"/>
  <text x="272" y="217" text-anchor="middle" class="mono" font-size="13">00000000</text>
  <rect x="360" y="196" width="160" height="32" rx="6" fill="#e6e2ff" stroke="#4b3cf5"/>
  <text x="440" y="217" text-anchor="middle" class="mono" font-size="13">00000000</text>
  <rect x="528" y="196" width="168" height="32" rx="6" fill="#4b3cf5"/>
  <text x="612" y="217" text-anchor="middle" class="w mono" font-size="13">00101010</text>
</g>

<g class="step" style="animation-delay:0.44s">
  <text x="24" y="268" class="t" font-size="14" font-weight="700">long d</text>
  <text x="110" y="268" class="m" font-size="13">8 bytes · address 1032</text>
  <rect x="24" y="284" width="80" height="28" rx="4" fill="#e6e2ff" stroke="#4b3cf5"/>
  <text x="64" y="303" text-anchor="middle" class="mono" font-size="9">00000000</text>
  <rect x="108" y="284" width="80" height="28" rx="4" fill="#e6e2ff" stroke="#4b3cf5"/>
  <text x="148" y="303" text-anchor="middle" class="mono" font-size="9">00000000</text>
  <rect x="192" y="284" width="80" height="28" rx="4" fill="#e6e2ff" stroke="#4b3cf5"/>
  <text x="232" y="303" text-anchor="middle" class="mono" font-size="9">00000000</text>
  <rect x="276" y="284" width="80" height="28" rx="4" fill="#e6e2ff" stroke="#4b3cf5"/>
  <text x="316" y="303" text-anchor="middle" class="mono" font-size="9">00000000</text>
  <rect x="360" y="284" width="80" height="28" rx="4" fill="#e6e2ff" stroke="#4b3cf5"/>
  <text x="400" y="303" text-anchor="middle" class="mono" font-size="9">00000000</text>
  <rect x="444" y="284" width="80" height="28" rx="4" fill="#e6e2ff" stroke="#4b3cf5"/>
  <text x="484" y="303" text-anchor="middle" class="mono" font-size="9">00000000</text>
  <rect x="528" y="284" width="80" height="28" rx="4" fill="#e6e2ff" stroke="#4b3cf5"/>
  <text x="568" y="303" text-anchor="middle" class="mono" font-size="9">00000000</text>
  <rect x="612" y="284" width="84" height="28" rx="4" fill="#4b3cf5"/>
  <text x="654" y="303" text-anchor="middle" class="w mono" font-size="9">00101010</text>
</g>

<text x="24" y="356" class="m" font-size="13">Most significant byte on the left, least significant byte on the right.</text>
<text x="24" y="382" class="m" font-size="13">These four objects are drawn separately. The addresses are labels, not one packed allocation.</text>
</svg>
