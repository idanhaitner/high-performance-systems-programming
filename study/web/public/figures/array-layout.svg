<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">

<style>
  .t { font-family: Heebo, system-ui, sans-serif; fill: #1c2740; }
  .m { font-family: Heebo, system-ui, sans-serif; fill: #5c6b82; }
  .w { font-family: Heebo, system-ui, sans-serif; fill: #ffffff; }
  .mono { font-family: "Source Code Pro", ui-monospace, monospace; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>


  <rect width="720" height="280" fill="#f4f7fb"/>
  <text x="24" y="36" class="t" font-size="15" font-weight="700">int a[4] = {10, 20, 30, 40};</text>
  <g class="step" style="animation-delay:0.08s">
    <rect x="24" y="64" width="156" height="92" rx="12" fill="#ffffff" stroke="#2f6fed"/><text x="102" y="90" text-anchor="middle" class="mono" font-size="13">0x1000</text><text x="102" y="118" text-anchor="middle" class="t" font-size="22" font-weight="700">10</text><text x="102" y="140" text-anchor="middle" class="m" font-size="13">a[0]</text><rect x="194" y="64" width="156" height="92" rx="12" fill="#ffffff" stroke="#2f6fed"/><text x="272" y="90" text-anchor="middle" class="mono" font-size="13">0x1004</text><text x="272" y="118" text-anchor="middle" class="t" font-size="22" font-weight="700">20</text><text x="272" y="140" text-anchor="middle" class="m" font-size="13">a[1]</text><rect x="364" y="64" width="156" height="92" rx="12" fill="#ffffff" stroke="#2f6fed"/><text x="442" y="90" text-anchor="middle" class="mono" font-size="13">0x1008</text><text x="442" y="118" text-anchor="middle" class="t" font-size="22" font-weight="700">30</text><text x="442" y="140" text-anchor="middle" class="m" font-size="13">a[2]</text><rect x="534" y="64" width="156" height="92" rx="12" fill="#ffffff" stroke="#2f6fed"/><text x="612" y="90" text-anchor="middle" class="mono" font-size="13">0x100C</text><text x="612" y="118" text-anchor="middle" class="t" font-size="22" font-weight="700">40</text><text x="612" y="140" text-anchor="middle" class="m" font-size="13">a[3]</text>
  </g>
  <g class="step" style="animation-delay:0.20s">
    <text x="24" y="196" class="mono" font-size="14">p = a</text>
    <text x="194" y="196" class="mono" font-size="14">p + 1</text>
    <text x="364" y="196" class="mono" font-size="14">p + 2</text>
    <text x="534" y="196" class="mono" font-size="14">p + 3</text>
    <text x="24" y="236" class="t" font-size="15">p + 1 advances by sizeof(*p) bytes. Here that is 4, so 0x1000 becomes 0x1004.</text>
    <text x="24" y="260" class="t" font-size="15">a[2] and *(a + 2) name the same cell, whose value is 30.</text>
  </g>

</svg>
