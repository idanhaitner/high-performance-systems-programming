    <text x="52" y="126" class="m" font-size="13" text-anchor="middle">0</text>
    <text x="164" y="126" class="m" font-size="13" text-anchor="middle">1 to 3</text>
    <text x="360" y="126" class="m" font-size="13" text-anchor="middle">4 to 7</text>
    <text x="500" y="126" class="m" font-size="13" text-anchor="middle">8</text>
    <text x="612" y="126" class="m" font-size="13" text-anchor="middle">9 to 11</text>
  </g>
  <g class="step" style="animation-delay:0.24s">
