<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img">

<style>
  .t { font-family: Heebo, system-ui, sans-serif; fill: #2c2140; }
  .m { font-family: Heebo, system-ui, sans-serif; fill: #6d6080; }
  .w { font-family: Heebo, system-ui, sans-serif; fill: #ffffff; }
  .mono { font-family: "Source Code Pro", ui-monospace, monospace; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>


  <rect width="720" height="230" fill="#f7f4fb"/>
  <text x="24" y="32" class="m" font-size="13">gcc main.c -o main runs every stage. You can stop after each one.</text>
  
  <g class="step" style="animation-delay:0.08s">
    <rect x="24" y="56" width="120" height="64" rx="12" fill="#ffffff" stroke="#d2c6e0"/>
    <text x="84" y="84" text-anchor="middle" class="t" font-size="13" font-weight="700">Source</text>
    <text x="84" y="104" text-anchor="middle" class="m" font-size="11">main.c</text>
  </g>
  <path d="M148 88 H160" stroke="#b09ac8" stroke-width="2"/>
  <g class="step" style="animation-delay:0.20s">
    <rect x="164" y="56" width="120" height="64" rx="12" fill="#eadcff" stroke="#6d4ad4"/>
    <text x="224" y="84" text-anchor="middle" class="t" font-size="13" font-weight="700">Preprocessor</text>
    <text x="224" y="104" text-anchor="middle" class="m" font-size="11">main.i</text>
  </g>
  <path d="M288 88 H300" stroke="#b09ac8" stroke-width="2"/>
  <g class="step" style="animation-delay:0.32s">
    <rect x="304" y="56" width="120" height="64" rx="12" fill="#eadcff" stroke="#6d4ad4"/>
    <text x="364" y="84" text-anchor="middle" class="t" font-size="13" font-weight="700">Compiler</text>
    <text x="364" y="104" text-anchor="middle" class="m" font-size="11">main.s</text>
  </g>
  <path d="M428 88 H440" stroke="#b09ac8" stroke-width="2"/>
  <g class="step" style="animation-delay:0.44s">
    <rect x="444" y="56" width="120" height="64" rx="12" fill="#eadcff" stroke="#6d4ad4"/>
    <text x="504" y="84" text-anchor="middle" class="t" font-size="13" font-weight="700">Assembler</text>
    <text x="504" y="104" text-anchor="middle" class="m" font-size="11">main.o</text>
  </g>
  <path d="M568 88 H580" stroke="#b09ac8" stroke-width="2"/>
  <g class="step" style="animation-delay:0.56s">
    <rect x="584" y="56" width="120" height="64" rx="12" fill="#2c2140" stroke="#2c2140"/>
    <text x="644" y="84" text-anchor="middle" class="w" font-size="13" font-weight="700">Linker</text>
    <text x="644" y="104" text-anchor="middle" class="w" font-size="11">executable</text>
  </g>
  
  <g class="step" style="animation-delay:0.68s">
    <text x="24" y="164" class="mono" font-size="13">gcc -E   stop after preprocessing</text>
    <text x="24" y="186" class="mono" font-size="13">gcc -S   stop after compilation to assembly</text>
    <text x="380" y="164" class="mono" font-size="13">gcc -c   stop after the object file</text>
    <text x="380" y="186" class="mono" font-size="13">gcc main.o -o main   link</text>
  </g>

</svg>
