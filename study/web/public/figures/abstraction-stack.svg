<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">

<style>
  .t { font-family: Heebo, system-ui, sans-serif; fill: #1c2740; }
  .m { font-family: Heebo, system-ui, sans-serif; fill: #5c6b82; }
  .w { font-family: Heebo, system-ui, sans-serif; fill: #ffffff; }
  .mono { font-family: "Source Code Pro", ui-monospace, monospace; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>


  <rect width="720" height="340" fill="#f4f7fb"/>
  <g class="step" style="animation-delay:0.08s">
    <rect x="160" y="28" width="400" height="72" rx="14" fill="#e7eef8" stroke="#c5d0e0"/>
    <text x="360" y="56" text-anchor="middle" class="t" font-size="18" font-weight="700">Application code</text>
    <text x="360" y="80" text-anchor="middle" class="m" font-size="14">Hidden representation</text>
  </g>
  <g class="step" style="animation-delay:0.20s">
    <path d="M360 108 V132" stroke="#2f6fed" stroke-width="2"/>
    <path d="M354 126 L360 136 L366 126" fill="#2f6fed"/>
    <rect x="160" y="140" width="400" height="72" rx="14" fill="#2f6fed"/>
    <text x="360" y="168" text-anchor="middle" class="w" font-size="18" font-weight="700">C</text>
    <text x="360" y="192" text-anchor="middle" class="w" font-size="14">Widths, addresses, layout</text>
  </g>
  <g class="step" style="animation-delay:0.32s">
    <path d="M360 220 V244" stroke="#2f6fed" stroke-width="2"/>
    <path d="M354 238 L360 248 L366 238" fill="#2f6fed"/>
    <rect x="160" y="252" width="400" height="72" rx="14" fill="#1c2740"/>
    <text x="360" y="280" text-anchor="middle" class="w" font-size="18" font-weight="700">Processor and OS</text>
    <text x="360" y="304" text-anchor="middle" class="w" font-size="14">Instructions and memory</text>
  </g>

</svg>
