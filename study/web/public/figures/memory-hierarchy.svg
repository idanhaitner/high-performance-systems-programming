<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .g { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #17784f; }
  .r { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #b4233f; }
  .a { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4b3cf5; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="340" fill="#f7f6ff"/>
  <g class="step" style="animation-delay:0.08s">
  <rect x="260.0" y="24" width="200" height="44" rx="8" fill="#17784f" stroke="#17784f" stroke-width="0"/>
  <text x="360" y="53" class="w" font-size="17" text-anchor="middle" font-weight="700">Registers</text>
  <rect x="225.0" y="82" width="270" height="44" rx="8" fill="#2f4fd6" stroke="#2f4fd6" stroke-width="0"/>
  <text x="360" y="111" class="w" font-size="17" text-anchor="middle" font-weight="700">L1 cache</text>
  <rect x="190.0" y="140" width="340" height="44" rx="8" fill="#6a4fd8" stroke="#6a4fd8" stroke-width="0"/>
  <text x="360" y="169" class="w" font-size="17" text-anchor="middle" font-weight="700">L2 cache</text>
  <rect x="155.0" y="198" width="410" height="44" rx="8" fill="#9a6a00" stroke="#9a6a00" stroke-width="0"/>
  <text x="360" y="227" class="w" font-size="17" text-anchor="middle" font-weight="700">L3 cache</text>
  <rect x="120.0" y="256" width="480" height="44" rx="8" fill="#b4233f" stroke="#b4233f" stroke-width="0"/>
  <text x="360" y="285" class="w" font-size="17" text-anchor="middle" font-weight="700">Main memory</text>
  </g>
  <g class="step" style="animation-delay:0.24s">
  <text x="24" y="52" class="g" font-size="15" text-anchor="start" font-weight="700">smaller</text>
  <text x="24" y="72" class="g" font-size="15" text-anchor="start" font-weight="700">closer</text>
  <text x="24" y="92" class="g" font-size="15" text-anchor="start" font-weight="700">faster</text>
  <text x="696" y="284" class="r" font-size="15" text-anchor="end" font-weight="700">larger</text>
  <text x="696" y="304" class="r" font-size="15" text-anchor="end" font-weight="700">farther</text>
  <text x="696" y="324" class="r" font-size="15" text-anchor="end" font-weight="700">slower</text>
  </g>
</svg>
