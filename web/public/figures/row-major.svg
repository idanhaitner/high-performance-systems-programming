<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .g { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #17784f; }
  .r { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #b4233f; }
  .a { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4b3cf5; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="250" fill="#f7f6ff"/>
  <text x="24" y="34" class="mono" font-size="15" text-anchor="start" font-weight="700">int a[3][4];</text>
  <g class="step" style="animation-delay:0.08s">
  <rect x="36" y="64" width="54" height="56" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="63.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[0][0]</text>
  <rect x="90" y="64" width="54" height="56" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="117.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[0][1]</text>
  <rect x="144" y="64" width="54" height="56" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="171.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[0][2]</text>
  <rect x="198" y="64" width="54" height="56" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="225.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[0][3]</text>
  <rect x="252" y="64" width="54" height="56" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="279.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[1][0]</text>
  <rect x="306" y="64" width="54" height="56" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="333.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[1][1]</text>
  <rect x="360" y="64" width="54" height="56" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="387.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[1][2]</text>
  <rect x="414" y="64" width="54" height="56" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="441.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[1][3]</text>
  <rect x="468" y="64" width="54" height="56" fill="#fff0cc" stroke="#b07a00" stroke-width="1.5"/>
  <text x="495.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[2][0]</text>
  <rect x="522" y="64" width="54" height="56" fill="#fff0cc" stroke="#b07a00" stroke-width="1.5"/>
  <text x="549.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[2][1]</text>
  <rect x="576" y="64" width="54" height="56" fill="#fff0cc" stroke="#b07a00" stroke-width="1.5"/>
  <text x="603.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[2][2]</text>
  <rect x="630" y="64" width="54" height="56" fill="#fff0cc" stroke="#b07a00" stroke-width="1.5"/>
  <text x="657.0" y="95.85" class="mono" font-size="11" text-anchor="middle">a[2][3]</text>
  <text x="144" y="146" class="t" font-size="14" text-anchor="middle" font-weight="700">row 0</text>
  <text x="360" y="146" class="t" font-size="14" text-anchor="middle" font-weight="700">row 1</text>
  <text x="576" y="146" class="t" font-size="14" text-anchor="middle" font-weight="700">row 2</text>
  </g>
  <g class="step" style="animation-delay:0.24s">
  <text x="36" y="196" class="t" font-size="15" text-anchor="start">Memory runs left to right. The last index changes fastest.</text>
  <text x="36" y="222" class="mono" font-size="14" text-anchor="start">Position of a[i][j] in the row: i * 4 + j</text>
  </g>
</svg>
