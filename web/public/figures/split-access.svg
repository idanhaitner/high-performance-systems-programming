  <text x="360" y="244" class="w" font-size="14" text-anchor="middle" font-weight="700">62-65</text>
  <text x="24" y="292" class="r" font-size="16" text-anchor="start" font-weight="700">Split: the int crosses the boundary, so the access may need both lines</text>
