<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .g { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #17784f; }
  .r { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #b4233f; }
  .a { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4b3cf5; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="200" fill="#f7f6ff"/>
  <g class="step" style="animation-delay:0.08s">
  <text x="24" y="34" class="t" font-size="16" text-anchor="start" font-weight="700">The processor checks the closest level first</text>
  <rect x="24" y="60" width="112" height="72" rx="8" fill="#1b1740" stroke="#1b1740" stroke-width="0"/>
  <text x="80.0" y="104" class="w" font-size="20" text-anchor="middle" font-weight="700">CPU</text>
  <line x1="136" y1="96" x2="164" y2="96" stroke="#4f4a75" stroke-width="3"/>
  <rect x="164" y="60" width="112" height="72" rx="8" fill="#17784f" stroke="#17784f" stroke-width="0"/>
  <text x="220.0" y="104" class="w" font-size="20" text-anchor="middle" font-weight="700">L1</text>
  <line x1="276" y1="96" x2="304" y2="96" stroke="#4f4a75" stroke-width="3"/>
  <rect x="304" y="60" width="112" height="72" rx="8" fill="#2f4fd6" stroke="#2f4fd6" stroke-width="0"/>
  <text x="360.0" y="104" class="w" font-size="20" text-anchor="middle" font-weight="700">L2</text>
  <line x1="416" y1="96" x2="444" y2="96" stroke="#4f4a75" stroke-width="3"/>
  <rect x="444" y="60" width="112" height="72" rx="8" fill="#6a4fd8" stroke="#6a4fd8" stroke-width="0"/>
  <text x="500.0" y="104" class="w" font-size="20" text-anchor="middle" font-weight="700">L3</text>
  <line x1="556" y1="96" x2="584" y2="96" stroke="#4f4a75" stroke-width="3"/>
  <rect x="584" y="60" width="112" height="72" rx="8" fill="#b4233f" stroke="#b4233f" stroke-width="0"/>
  <text x="640.0" y="104" class="w" font-size="20" text-anchor="middle" font-weight="700">RAM</text>
  </g>
  <g class="step" style="animation-delay:0.24s">
  <text x="24" y="168" class="a" font-size="16" text-anchor="start" font-weight="700">A miss at one level can still be a hit at the next level.</text>
  </g>
</svg>
