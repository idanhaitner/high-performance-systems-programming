<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="320" fill="#f7f6ff"/>
  <g class="step" style="animation-delay:0.08s">
  <defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4b3cf5"/></marker></defs>
    <rect x="40" y="24" width="250" height="236" fill="#ffffff" stroke="#4b3cf5" stroke-width="2.5" rx="6"/>
    <text x="165" y="50" class="t" font-size="16" text-anchor="middle" font-weight="700">GenericBox</text>
    <rect x="60" y="64" width="210" height="56" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="165" y="97" class="mono" font-size="15" text-anchor="middle">void *data</text>
    <rect x="60" y="130" width="210" height="56" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="165" y="163" class="mono" font-size="15" text-anchor="middle">size_t size</text>
    <rect x="60" y="196" width="210" height="56" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="165" y="229" class="mono" font-size="15" text-anchor="middle">print</text>
    <line x1="270" y1="92" x2="430" y2="60" stroke="#4b3cf5" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="430" y="30" width="250" height="60" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="555" y="65" class="mono" font-size="15" text-anchor="middle">int x = 42</text>
    <line x1="270" y1="224" x2="430" y2="224" stroke="#4b3cf5" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="430" y="194" width="250" height="60" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="555" y="229" class="mono" font-size="15" text-anchor="middle">print_int(self)</text>
    <text x="555" y="120" class="m" font-size="14" text-anchor="middle">the data</text>
    <text x="555" y="184" class="m" font-size="14" text-anchor="middle">the function</text>
    <text x="360" y="300" class="mono" font-size="16" text-anchor="middle">box.print(&amp;box)   runs   print_int(&amp;box)</text>
  </g>

</svg>
