<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="196" fill="#f7f6ff"/>
  <g class="step" style="animation-delay:0.08s">
    <text x="24" y="28" class="t" font-size="16" text-anchor="start" font-weight="700">Block B starts at byte 5</text>
    <rect x="24" y="44" width="42" height="52" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="45" y="75" class="mono" font-size="14" text-anchor="middle">0</text>
    <rect x="66" y="44" width="42" height="52" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="87" y="75" class="mono" font-size="14" text-anchor="middle">1</text>
    <rect x="108" y="44" width="42" height="52" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="129" y="75" class="mono" font-size="14" text-anchor="middle">2</text>
    <rect x="150" y="44" width="42" height="52" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="171" y="75" class="mono" font-size="14" text-anchor="middle">3</text>
    <rect x="192" y="44" width="42" height="52" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="213" y="75" class="mono" font-size="14" text-anchor="middle">4</text>
    <rect x="234" y="44" width="42" height="52" fill="#ffe3e3" stroke="#d6336c" stroke-width="2"/>
    <text x="255" y="75" class="mono" font-size="14" text-anchor="middle">5</text>
    <rect x="276" y="44" width="42" height="52" fill="#ffe3e3" stroke="#d6336c" stroke-width="2"/>
    <text x="297" y="75" class="mono" font-size="14" text-anchor="middle">6</text>
    <rect x="318" y="44" width="42" height="52" fill="#ffe3e3" stroke="#d6336c" stroke-width="2"/>
    <text x="339" y="75" class="mono" font-size="14" text-anchor="middle">7</text>
    <rect x="360" y="44" width="42" height="52" fill="#ffe3e3" stroke="#d6336c" stroke-width="2"/>
    <text x="381" y="75" class="mono" font-size="14" text-anchor="middle">8</text>
    <rect x="402" y="44" width="42" height="52" fill="#ffe3e3" stroke="#d6336c" stroke-width="2"/>
    <text x="423" y="75" class="mono" font-size="14" text-anchor="middle">9</text>
    <rect x="444" y="44" width="42" height="52" fill="#ffe3e3" stroke="#d6336c" stroke-width="2"/>
    <text x="465" y="75" class="mono" font-size="14" text-anchor="middle">10</text>
    <rect x="486" y="44" width="42" height="52" fill="#ffe3e3" stroke="#d6336c" stroke-width="2"/>
    <text x="507" y="75" class="mono" font-size="14" text-anchor="middle">11</text>
    <rect x="528" y="44" width="42" height="52" fill="#ffe3e3" stroke="#d6336c" stroke-width="2"/>
    <text x="549" y="75" class="mono" font-size="14" text-anchor="middle">12</text>
    <rect x="570" y="44" width="42" height="52" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
    <text x="591" y="75" class="mono" font-size="14" text-anchor="middle">13</text>
    <rect x="612" y="44" width="42" height="52" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
    <text x="633" y="75" class="mono" font-size="14" text-anchor="middle">14</text>
    <rect x="654" y="44" width="42" height="52" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
    <text x="675" y="75" class="mono" font-size="14" text-anchor="middle">15</text>
    <text x="129" y="124" class="m" font-size="13" text-anchor="middle">A: bytes 0 to 4</text>
    <text x="402" y="124" class="m" font-size="13" text-anchor="middle">B: bytes 5 to 12</text>
    <text x="633" y="124" class="m" font-size="13" text-anchor="middle">free</text>
    <text x="360" y="168" class="m" font-size="14" text-anchor="middle">5 is not a multiple of 8, so a double stored here is misaligned.</text>
  </g>

</svg>
