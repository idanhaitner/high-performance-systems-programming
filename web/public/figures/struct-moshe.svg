<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>


  <rect width="720" height="250" fill="#f7f6ff"/>
  <text x="24" y="32" class="t" font-size="15" font-weight="700">Student s = {"Moshe", 1111} at address 1000</text>
  <text x="24" y="54" class="m" font-size="13">name[8] comes first. id is the int that follows those 8 bytes.</text>
  <g class="step" style="animation-delay:0.08s">
    <rect x="24" y="80" width="60" height="64" rx="8" fill="#e6e2ff" stroke="#4b3cf5"/><text x="54" y="108" text-anchor="middle" class="mono" font-size="16">M</text><text x="54" y="132" text-anchor="middle" class="m" font-size="11">1000</text><rect x="88" y="80" width="60" height="64" rx="8" fill="#e6e2ff" stroke="#4b3cf5"/><text x="118" y="108" text-anchor="middle" class="mono" font-size="16">o</text><text x="118" y="132" text-anchor="middle" class="m" font-size="11">1001</text><rect x="152" y="80" width="60" height="64" rx="8" fill="#e6e2ff" stroke="#4b3cf5"/><text x="182" y="108" text-anchor="middle" class="mono" font-size="16">s</text><text x="182" y="132" text-anchor="middle" class="m" font-size="11">1002</text><rect x="216" y="80" width="60" height="64" rx="8" fill="#e6e2ff" stroke="#4b3cf5"/><text x="246" y="108" text-anchor="middle" class="mono" font-size="16">h</text><text x="246" y="132" text-anchor="middle" class="m" font-size="11">1003</text><rect x="280" y="80" width="60" height="64" rx="8" fill="#e6e2ff" stroke="#4b3cf5"/><text x="310" y="108" text-anchor="middle" class="mono" font-size="16">e</text><text x="310" y="132" text-anchor="middle" class="m" font-size="11">1004</text><rect x="344" y="80" width="60" height="64" rx="8" fill="#e6e2ff" stroke="#4b3cf5"/><text x="374" y="108" text-anchor="middle" class="mono" font-size="16">NUL</text><text x="374" y="132" text-anchor="middle" class="m" font-size="11">1005</text><rect x="408" y="80" width="60" height="64" rx="8" fill="#e6e2ff" stroke="#4b3cf5"/><text x="438" y="108" text-anchor="middle" class="mono" font-size="16">0</text><text x="438" y="132" text-anchor="middle" class="m" font-size="11">1006</text><rect x="472" y="80" width="60" height="64" rx="8" fill="#e6e2ff" stroke="#4b3cf5"/><text x="502" y="108" text-anchor="middle" class="mono" font-size="16">0</text><text x="502" y="132" text-anchor="middle" class="m" font-size="11">1007</text>
  </g>
  <g class="step" style="animation-delay:0.20s">
    <rect x="536" y="80" width="160" height="64" rx="8" fill="#1b1740"/>
    <text x="616" y="108" text-anchor="middle" class="w" font-size="18" font-weight="700">1111</text>
    <text x="616" y="132" text-anchor="middle" class="w" font-size="12">id · address 1008</text>
  </g>
  <text x="24" y="186" class="t" font-size="14">"Moshe" stores five characters and a terminating NUL. The last two name bytes stay 0.</text>
  <text x="24" y="214" class="m" font-size="14">Field order in the initializer matches field order in the type. {2222, "Omer"} does not compile.</text>

</svg>
