<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="296" fill="#f7f6ff"/>
  <defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4b3cf5"/></marker></defs>
  <g class="step" style="animation-delay:0.08s">
    <text x="24" y="36" class="t" font-size="16" text-anchor="start" font-weight="700">Little-endian: 78 is stored first</text>
    <rect x="24" y="50" width="160" height="56" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="104" y="83" class="mono" font-size="15" text-anchor="middle">0x78</text>
    <text x="104" y="128" class="m" font-size="13" text-anchor="middle">address + 0</text>
    <rect x="192" y="50" width="160" height="56" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="272" y="83" class="mono" font-size="15" text-anchor="middle">0x56</text>
    <text x="272" y="128" class="m" font-size="13" text-anchor="middle">address + 1</text>
    <rect x="360" y="50" width="160" height="56" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="440" y="83" class="mono" font-size="15" text-anchor="middle">0x34</text>
    <text x="440" y="128" class="m" font-size="13" text-anchor="middle">address + 2</text>
    <rect x="528" y="50" width="160" height="56" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="608" y="83" class="mono" font-size="15" text-anchor="middle">0x12</text>
    <text x="608" y="128" class="m" font-size="13" text-anchor="middle">address + 3</text>
  </g>
  <g class="step" style="animation-delay:0.24s">
    <text x="24" y="156" class="t" font-size="16" text-anchor="start" font-weight="700">Big-endian: 12 is stored first</text>
    <rect x="24" y="170" width="160" height="56" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="104" y="203" class="mono" font-size="15" text-anchor="middle">0x12</text>
    <text x="104" y="248" class="m" font-size="13" text-anchor="middle">address + 0</text>
    <rect x="192" y="170" width="160" height="56" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="272" y="203" class="mono" font-size="15" text-anchor="middle">0x34</text>
    <text x="272" y="248" class="m" font-size="13" text-anchor="middle">address + 1</text>
    <rect x="360" y="170" width="160" height="56" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="440" y="203" class="mono" font-size="15" text-anchor="middle">0x56</text>
    <text x="440" y="248" class="m" font-size="13" text-anchor="middle">address + 2</text>
    <rect x="528" y="170" width="160" height="56" fill="#ffffff" stroke="#4b3cf5" stroke-width="2"/>
    <text x="608" y="203" class="mono" font-size="15" text-anchor="middle">0x78</text>
    <text x="608" y="248" class="m" font-size="13" text-anchor="middle">address + 3</text>
  </g>
    <text x="360" y="276" class="m" font-size="14" text-anchor="middle">Same number, 0x12345678. Only the order of its four bytes changes.</text>

</svg>
