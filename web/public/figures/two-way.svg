<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .g { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #17784f; }
  .r { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #b4233f; }
  .a { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4b3cf5; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="320" fill="#f7f6ff"/>
  <g class="step" style="animation-delay:0.08s">
  <text x="24" y="30" class="t" font-size="16" text-anchor="start" font-weight="700">2-way set-associative cache</text>
  <text x="24" y="82" class="m" font-size="15" text-anchor="start" font-weight="700">Set 0</text>
  <rect x="100" y="50" width="220" height="46" fill="#ffffff" stroke="#c9c3f5" stroke-width="1.5"/>
  <text x="210.0" y="77.55" class="mono" font-size="13" text-anchor="middle"></text>
  <rect x="332" y="50" width="220" height="46" fill="#ffffff" stroke="#c9c3f5" stroke-width="1.5"/>
  <text x="442.0" y="77.55" class="mono" font-size="13" text-anchor="middle"></text>
  <text x="24" y="144" class="m" font-size="15" text-anchor="start" font-weight="700">Set 1</text>
  <rect x="100" y="112" width="220" height="46" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="210.0" y="139.9" class="a" font-size="14" text-anchor="middle" font-weight="700">Address A</text>
  <rect x="332" y="112" width="220" height="46" fill="#ffe3dc" stroke="#b4233f" stroke-width="1.5"/>
  <text x="442.0" y="139.9" class="r" font-size="14" text-anchor="middle" font-weight="700">Address B</text>
  <text x="24" y="206" class="m" font-size="15" text-anchor="start" font-weight="700">Set 2</text>
  <rect x="100" y="174" width="220" height="46" fill="#ffffff" stroke="#c9c3f5" stroke-width="1.5"/>
  <text x="210.0" y="201.55" class="mono" font-size="13" text-anchor="middle"></text>
  <rect x="332" y="174" width="220" height="46" fill="#ffffff" stroke="#c9c3f5" stroke-width="1.5"/>
  <text x="442.0" y="201.55" class="mono" font-size="13" text-anchor="middle"></text>
  <text x="24" y="268" class="m" font-size="15" text-anchor="start" font-weight="700">Set 3</text>
  <rect x="100" y="236" width="220" height="46" fill="#ffffff" stroke="#c9c3f5" stroke-width="1.5"/>
  <text x="210.0" y="263.55" class="mono" font-size="13" text-anchor="middle"></text>
  <rect x="332" y="236" width="220" height="46" fill="#ffffff" stroke="#c9c3f5" stroke-width="1.5"/>
  <text x="442.0" y="263.55" class="mono" font-size="13" text-anchor="middle"></text>
  <text x="210" y="296" class="m" font-size="13" text-anchor="middle">way 0</text>
  <text x="442" y="296" class="m" font-size="13" text-anchor="middle">way 1</text>
  </g>
  <g class="step" style="animation-delay:0.24s">
  <rect x="576" y="110" width="120" height="110" rx="12" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="636" y="138" class="g" font-size="14" text-anchor="middle" font-weight="700">Each set has</text>
  <text x="636" y="156" class="g" font-size="14" text-anchor="middle" font-weight="700">two ways</text>
  <text x="636" y="184" class="t" font-size="12" text-anchor="middle">Fewer conflicts,</text>
  <text x="636" y="202" class="t" font-size="12" text-anchor="middle">more lookup work</text>
  </g>
</svg>
