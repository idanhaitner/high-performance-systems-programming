<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .g { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #17784f; }
  .r { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #b4233f; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="300" fill="#f7f6ff"/>

  <g class="step" style="animation-delay:0.08s">
  <text x="24" y="32" class="t" font-size="16" font-weight="700">An array of pointers: one malloc per point</text>
  <rect x="24" y="52" width="40" height="28" rx="4" fill="#1b1740"/><text x="44" y="71" class="w" font-size="12" text-anchor="middle">p0</text>
  <rect x="24" y="84" width="40" height="28" rx="4" fill="#1b1740"/><text x="44" y="103" class="w" font-size="12" text-anchor="middle">p1</text>
  <rect x="24" y="116" width="40" height="28" rx="4" fill="#1b1740"/><text x="44" y="135" class="w" font-size="12" text-anchor="middle">p2</text>
  <rect x="24" y="148" width="40" height="28" rx="4" fill="#1b1740"/><text x="44" y="167" class="w" font-size="12" text-anchor="middle">p3</text>
  <rect x="250" y="54" width="70" height="26" rx="4" fill="#b4233f"/><text x="285" y="72" class="w" font-size="12" text-anchor="middle">x, y</text>
  <rect x="120" y="128" width="70" height="26" rx="4" fill="#b4233f"/><text x="155" y="146" class="w" font-size="12" text-anchor="middle">x, y</text>
  <rect x="300" y="160" width="70" height="26" rx="4" fill="#b4233f"/><text x="335" y="178" class="w" font-size="12" text-anchor="middle">x, y</text>
  <rect x="180" y="92" width="70" height="26" rx="4" fill="#b4233f"/><text x="215" y="110" class="w" font-size="12" text-anchor="middle">x, y</text>
  <line x1="64" y1="66" x2="250" y2="67" stroke="#4f4a75" stroke-width="2"/>
  <line x1="64" y1="98" x2="180" y2="105" stroke="#4f4a75" stroke-width="2"/>
  <line x1="64" y1="130" x2="120" y2="141" stroke="#4f4a75" stroke-width="2"/>
  <line x1="64" y1="162" x2="300" y2="173" stroke="#4f4a75" stroke-width="2"/>
  <text x="24" y="210" class="r" font-size="14" font-weight="700">Many malloc calls, extra bytes per block,</text>
  <text x="24" y="230" class="r" font-size="14" font-weight="700">and points scattered across memory.</text>
  </g>

  <g class="step" style="animation-delay:0.3s">
  <text x="410" y="32" class="t" font-size="16" font-weight="700">One block: one malloc for all</text>
  <rect x="410" y="52" width="40" height="28" rx="4" fill="#1b1740"/><text x="430" y="71" class="w" font-size="12" text-anchor="middle">pts</text>
  <line x1="450" y1="66" x2="480" y2="66" stroke="#4f4a75" stroke-width="2"/>
  <rect x="480" y="52" width="54" height="28" rx="4" fill="#17784f"/><text x="507" y="71" class="w" font-size="12" text-anchor="middle">x, y</text>
  <rect x="536" y="52" width="54" height="28" rx="4" fill="#17784f"/><text x="563" y="71" class="w" font-size="12" text-anchor="middle">x, y</text>
  <rect x="592" y="52" width="54" height="28" rx="4" fill="#17784f"/><text x="619" y="71" class="w" font-size="12" text-anchor="middle">x, y</text>
  <rect x="648" y="52" width="54" height="28" rx="4" fill="#17784f"/><text x="675" y="71" class="w" font-size="12" text-anchor="middle">x, y</text>
  <text x="480" y="104" class="m" font-size="13">pts[0]   pts[1]   pts[2]   pts[3]</text>
  <text x="410" y="210" class="g" font-size="14" font-weight="700">One call, no pointers to store, and the</text>
  <text x="410" y="230" class="g" font-size="14" font-weight="700">points sit side by side in cache lines.</text>
  </g>

  <g class="step" style="animation-delay:0.5s">
  <text x="24" y="276" class="t" font-size="14" font-weight="700">Reading the points in order touches far fewer cache lines in the single block.</text>
  </g>
</svg>
