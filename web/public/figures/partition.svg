<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .a { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4b3cf5; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="210" fill="#f7f6ff"/>
  <text x="24" y="32" class="t" font-size="16" font-weight="700">One array of n elements, four threads, four ranges</text>

  <g class="step" style="animation-delay:0.08s">
  <rect x="24" y="56" width="168" height="44" rx="6" fill="#17784f"/><text x="108" y="83" class="w" font-size="14" font-weight="700" text-anchor="middle">Thread 0</text>
  <rect x="196" y="56" width="168" height="44" rx="6" fill="#2f4fd6"/><text x="280" y="83" class="w" font-size="14" font-weight="700" text-anchor="middle">Thread 1</text>
  <rect x="368" y="56" width="168" height="44" rx="6" fill="#6a4fd8"/><text x="452" y="83" class="w" font-size="14" font-weight="700" text-anchor="middle">Thread 2</text>
  <rect x="540" y="56" width="156" height="44" rx="6" fill="#e8642c"/><text x="618" y="83" class="w" font-size="14" font-weight="700" text-anchor="middle">Thread 3</text>
  </g>

  <g class="step" style="animation-delay:0.3s">
  <text x="108" y="126" class="mono" font-size="13" text-anchor="middle">[0, n/4)</text>
  <text x="280" y="126" class="mono" font-size="13" text-anchor="middle">[n/4, 2n/4)</text>
  <text x="452" y="126" class="mono" font-size="13" text-anchor="middle">[2n/4, 3n/4)</text>
  <text x="618" y="126" class="mono" font-size="13" text-anchor="middle">[3n/4, n)</text>
  </g>

  <g class="step" style="animation-delay:0.5s">
  <text x="24" y="166" class="a" font-size="14" font-weight="700">Every element belongs to exactly one thread: no gaps and no overlap.</text>
  <text x="24" y="190" class="m" font-size="14">Pieces of about the same size keep every thread busy until the end.</text>
  </g>
</svg>
