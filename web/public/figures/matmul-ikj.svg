  <text x="492" y="80" class="g" font-size="14" text-anchor="start" font-weight="700">Simplified cache model</text>
  <text x="492" y="110" class="t" font-size="13" text-anchor="start" font-weight="700">A[i][k]: loaded once,</text>
  <text x="492" y="128" class="t" font-size="13" text-anchor="start" font-weight="700">reused N times</text>
  <text x="492" y="158" class="t" font-size="13" text-anchor="start" font-weight="700">B row: 1 miss per 8 loads</text>
  <text x="492" y="176" class="t" font-size="13" text-anchor="start">87.5% hits</text>
  <text x="492" y="206" class="t" font-size="13" text-anchor="start" font-weight="700">C row stays hot across k</text>
  <text x="492" y="236" class="g" font-size="14" text-anchor="start" font-weight="700">B and C: roughly 94% hits</text>
  <text x="476" y="282" class="m" font-size="12" text-anchor="start">Measured: the last-level cache</text>
  <text x="476" y="300" class="m" font-size="12" text-anchor="start">miss rate fell from 7.7% to 1.0%.</text>
