  <text x="44" y="444" class="w" font-size="14" text-anchor="start">for (j...) C[i][j] += aik * B[k][j];</text>
  <text x="44" y="464" class="w" font-size="13" text-anchor="start">Both B and C walk along a row, and aik does not change.</text>
