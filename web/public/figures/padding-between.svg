<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .g { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #17784f; }
  .r { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #b4233f; }
  .a { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4b3cf5; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="270" fill="#f7f6ff"/>
  <g class="step" style="animation-delay:0.08s">
  <text x="24" y="34" class="r" font-size="16" text-anchor="start" font-weight="700">Without padding</text>
  <rect x="24" y="50" width="40" height="52" fill="#fff0cc" stroke="#b07a00" stroke-width="1.5"/>
  <text x="44.0" y="80.55" class="mono" font-size="13" text-anchor="middle">c</text>
  <rect x="64" y="50" width="40" height="52" fill="#ffe3dc" stroke="#b4233f" stroke-width="1.5"/>
  <text x="84.0" y="80.55" class="mono" font-size="13" text-anchor="middle">x0</text>
  <rect x="104" y="50" width="40" height="52" fill="#ffe3dc" stroke="#b4233f" stroke-width="1.5"/>
  <text x="124.0" y="80.55" class="mono" font-size="13" text-anchor="middle">x1</text>
  <rect x="144" y="50" width="40" height="52" fill="#ffe3dc" stroke="#b4233f" stroke-width="1.5"/>
  <text x="164.0" y="80.55" class="mono" font-size="13" text-anchor="middle">x2</text>
  <rect x="184" y="50" width="40" height="52" fill="#ffe3dc" stroke="#b4233f" stroke-width="1.5"/>
  <text x="204.0" y="80.55" class="mono" font-size="13" text-anchor="middle">x3</text>
  <text x="44.0" y="122" class="m" font-size="12" text-anchor="middle">0</text>
  <text x="84.0" y="122" class="m" font-size="12" text-anchor="middle">1</text>
  <text x="124.0" y="122" class="m" font-size="12" text-anchor="middle">2</text>
  <text x="164.0" y="122" class="m" font-size="12" text-anchor="middle">3</text>
  <text x="204.0" y="122" class="m" font-size="12" text-anchor="middle">4</text>
  <text x="24" y="150" class="r" font-size="15" text-anchor="start" font-weight="700">x begins at offset 1</text>
  <text x="24" y="172" class="m" font-size="13" text-anchor="start">1 is not a multiple of 4</text>
  </g>
  <g class="step" style="animation-delay:0.24s">
  <text x="360" y="34" class="g" font-size="16" text-anchor="start" font-weight="700">With padding</text>
  <rect x="360" y="50" width="40" height="52" fill="#fff0cc" stroke="#b07a00" stroke-width="1.5"/>
  <text x="380.0" y="80.55" class="mono" font-size="13" text-anchor="middle">c</text>
  <rect x="400" y="50" width="40" height="52" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
  <text x="420.0" y="80.2" class="m" font-size="12" text-anchor="middle">pad</text>
  <rect x="440" y="50" width="40" height="52" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
  <text x="460.0" y="80.2" class="m" font-size="12" text-anchor="middle">pad</text>
  <rect x="480" y="50" width="40" height="52" fill="#ecebf5" stroke="#6b6690" stroke-width="1.5"/>
  <text x="500.0" y="80.2" class="m" font-size="12" text-anchor="middle">pad</text>
  <rect x="520" y="50" width="40" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="540.0" y="80.55" class="mono" font-size="13" text-anchor="middle">x0</text>
  <rect x="560" y="50" width="40" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="580.0" y="80.55" class="mono" font-size="13" text-anchor="middle">x1</text>
  <rect x="600" y="50" width="40" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="620.0" y="80.55" class="mono" font-size="13" text-anchor="middle">x2</text>
  <rect x="640" y="50" width="40" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="660.0" y="80.55" class="mono" font-size="13" text-anchor="middle">x3</text>
  <text x="380.0" y="122" class="m" font-size="12" text-anchor="middle">0</text>
  <text x="420.0" y="122" class="m" font-size="12" text-anchor="middle">1</text>
  <text x="460.0" y="122" class="m" font-size="12" text-anchor="middle">2</text>
  <text x="500.0" y="122" class="m" font-size="12" text-anchor="middle">3</text>
  <text x="540.0" y="122" class="m" font-size="12" text-anchor="middle">4</text>
  <text x="580.0" y="122" class="m" font-size="12" text-anchor="middle">5</text>
  <text x="620.0" y="122" class="m" font-size="12" text-anchor="middle">6</text>
  <text x="660.0" y="122" class="m" font-size="12" text-anchor="middle">7</text>
  <text x="360" y="150" class="g" font-size="15" text-anchor="start" font-weight="700">x begins at offset 4</text>
  </g>
  <g class="step" style="animation-delay:0.40s">
  <rect x="120" y="192" width="480" height="56" rx="12" fill="#ffffff" stroke="#dcd8f5" stroke-width="1.5"/>
  <text x="150" y="226" class="mono" font-size="15" text-anchor="start">struct S { char c; int x; };</text>
  <text x="450" y="226" class="g" font-size="16" text-anchor="start" font-weight="700">sizeof(S) = 8</text>
  </g>
</svg>
