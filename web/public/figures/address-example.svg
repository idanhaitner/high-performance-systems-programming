<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .g { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #17784f; }
  .r { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #b4233f; }
  .a { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4b3cf5; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="330" fill="#f7f6ff"/>
  <g class="step" style="animation-delay:0.08s">
  <text x="24" y="48" class="t" font-size="20" text-anchor="start" font-weight="700">Address 0x12D0</text>
  <text x="24" y="72" class="m" font-size="14" text-anchor="start">64 B lines, 16 sets, direct-mapped</text>
  <text x="172.5" y="106" class="mono" font-size="17" text-anchor="middle" font-weight="700">000100</text>
  <rect x="60" y="118" width="225.0" height="52" fill="#6a4fd8" stroke="#6a4fd8" stroke-width="0"/>
  <text x="172.5" y="150" class="w" font-size="16" text-anchor="middle" font-weight="700">Tag</text>
  <text x="360.0" y="106" class="mono" font-size="17" text-anchor="middle" font-weight="700">1011</text>
  <rect x="285.0" y="118" width="150.0" height="52" fill="#2f4fd6" stroke="#2f4fd6" stroke-width="0"/>
  <text x="360.0" y="150" class="w" font-size="16" text-anchor="middle" font-weight="700">Set index</text>
  <text x="547.5" y="106" class="mono" font-size="17" text-anchor="middle" font-weight="700">010000</text>
  <rect x="435.0" y="118" width="225.0" height="52" fill="#17784f" stroke="#17784f" stroke-width="0"/>
  <text x="547.5" y="150" class="w" font-size="16" text-anchor="middle" font-weight="700">Block offset</text>
  </g>
  <g class="step" style="animation-delay:0.24s">
  <rect x="24" y="194" width="216" height="78" rx="12" fill="#ffffff" stroke="#17784f" stroke-width="1.8"/>
  <text x="40" y="220" class="a" font-size="16" text-anchor="start" font-weight="700">Offset</text>
  <text x="132" y="252" class="t" font-size="12" text-anchor="middle">0x12D0 mod 64 = 16</text>
  <rect x="252" y="194" width="216" height="78" rx="12" fill="#ffffff" stroke="#2f4fd6" stroke-width="1.8"/>
  <text x="268" y="220" class="a" font-size="16" text-anchor="start" font-weight="700">Set</text>
  <text x="360" y="252" class="t" font-size="12" text-anchor="middle">floor(0x12D0 / 64) mod 16 = 11</text>
  <rect x="480" y="194" width="216" height="78" rx="12" fill="#ffffff" stroke="#6a4fd8" stroke-width="1.8"/>
  <text x="496" y="220" class="a" font-size="16" text-anchor="start" font-weight="700">Tag</text>
  <text x="588" y="252" class="t" font-size="12" text-anchor="middle">floor(0x12D0 / (64 × 16)) = 4</text>
  <text x="360" y="308" class="t" font-size="15" text-anchor="middle" font-weight="700">The cache checks set 11 and compares the stored tag with 4.</text>
  </g>
</svg>
