  <g class="step" style="animation-delay:0.24s">
  <rect x="476" y="52" width="220" height="190" rx="12" fill="#ffe3dc" stroke="#b4233f" stroke-width="1.5"/>
  <text x="492" y="80" class="r" font-size="14" text-anchor="start" font-weight="700">Simplified cache model</text>
  <text x="492" y="110" class="t" font-size="13" text-anchor="start" font-weight="700">A: 1 miss per 8 loads</text>
  <text x="492" y="130" class="t" font-size="13" text-anchor="start">87.5% hits</text>
  <text x="492" y="160" class="t" font-size="13" text-anchor="start" font-weight="700">B: about 1 miss per load</text>
  <text x="492" y="180" class="t" font-size="13" text-anchor="start">near 0% hits</text>
  <text x="492" y="214" class="r" font-size="14" text-anchor="start" font-weight="700">Together: about 56% misses</text>
  <text x="476" y="266" class="m" font-size="12" text-anchor="start">Model: row-major doubles, 64 B lines,</text>
  <text x="476" y="284" class="m" font-size="12" text-anchor="start">large N, cold cache, no prefetch.</text>
  </g>
  <g class="step" style="animation-delay:0.40s">
  <rect x="24" y="318" width="672" height="56" rx="10" fill="#1b1740" stroke="#1b1740" stroke-width="0"/>
  <text x="44" y="342" class="w" font-size="14" text-anchor="start">for (k...) sum += A[i][k] * B[k][j];</text>
  <text x="44" y="362" class="w" font-size="13" text-anchor="start">A[i][k] walks along a row. B[k][j] walks down a column.</text>
