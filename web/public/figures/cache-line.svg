  <rect x="612" y="60" width="42" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="633.0" y="90.9" class="mono" font-size="14" text-anchor="middle">14</text>
  <rect x="654" y="60" width="42" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="675.0" y="90.9" class="mono" font-size="14" text-anchor="middle">15</text>
  <text x="297.0" y="136" class="m" font-size="13" text-anchor="middle" font-weight="700">requested</text>
  <line x1="24" y1="152" x2="696" y2="152" stroke="#4b3cf5" stroke-width="3"/>
  <text x="360" y="178" class="a" font-size="16" text-anchor="middle" font-weight="700">16 ints × 4 bytes = one 64-byte cache line</text>
  </g>
  <g class="step" style="animation-delay:0.24s">
  <rect x="24" y="196" width="672" height="40" rx="10" fill="#dcf5e8" stroke="#17784f" stroke-width="1.5"/>
  <text x="360" y="222" class="t" font-size="14" text-anchor="middle">64 bytes is common, not universal. The unit of transfer is bigger than one value.</text>
  </g>
