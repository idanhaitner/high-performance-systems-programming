  <text x="465.0" y="90.9" class="mono" font-size="14" text-anchor="middle">10</text>
  <rect x="486" y="60" width="42" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="507.0" y="90.9" class="mono" font-size="14" text-anchor="middle">11</text>
  <rect x="528" y="60" width="42" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
