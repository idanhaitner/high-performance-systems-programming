  <text x="213.0" y="90.9" class="mono" font-size="14" text-anchor="middle">4</text>
  <rect x="234" y="60" width="42" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="255.0" y="90.9" class="mono" font-size="14" text-anchor="middle">5</text>
  <rect x="276" y="60" width="42" height="52" fill="#fff0cc" stroke="#b07a00" stroke-width="1.5"/>
  <text x="297.0" y="90.9" class="mono" font-size="14" text-anchor="middle">6</text>
  <rect x="318" y="60" width="42" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="339.0" y="90.9" class="mono" font-size="14" text-anchor="middle">7</text>
  <rect x="360" y="60" width="42" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
