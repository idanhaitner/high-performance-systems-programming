<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img">

<style>
  .t { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #1b1740; }
  .m { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4f4a75; }
  .w { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #ffffff; }
  .g { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #17784f; }
  .r { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #b4233f; }
  .a { font-family: Figtree, Heebo, system-ui, sans-serif; fill: #4b3cf5; }
  .mono { font-family: "JetBrains Mono", "Source Code Pro", ui-monospace, monospace; fill: #1b1740; }
  .step { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: appear 0.45s ease both; }
  }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none !important; opacity: 1 !important; }
  }
</style>

  <rect width="720" height="250" fill="#f7f6ff"/>
  <g class="step" style="animation-delay:0.08s">
  <text x="24" y="34" class="t" font-size="16" text-anchor="start" font-weight="700">A request for one int can bring its neighbors too</text>
  <rect x="24" y="60" width="42" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="45.0" y="90.9" class="mono" font-size="14" text-anchor="middle">0</text>
  <rect x="66" y="60" width="42" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="87.0" y="90.9" class="mono" font-size="14" text-anchor="middle">1</text>
  <rect x="108" y="60" width="42" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="129.0" y="90.9" class="mono" font-size="14" text-anchor="middle">2</text>
  <rect x="150" y="60" width="42" height="52" fill="#e6e2ff" stroke="#4b3cf5" stroke-width="1.5"/>
  <text x="171.0" y="90.9" class="mono" font-size="14" text-anchor="middle">3</text>
